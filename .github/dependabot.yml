# Dependabot : propose tout seul les mises à jour de sécurité des paquets
# Flutter/Dart (pub) et des actions GitHub (une fois par semaine).
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Dépendances"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Actions"
