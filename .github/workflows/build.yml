# Compile automatiquement l'appli pour Windows, Android, Mac et Linux
# à chaque push. Les fichiers prêts à installer apparaissent dans l'onglet
# « Actions » de GitHub > dernier run > « Artifacts ».
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Windows
          path: build/windows/x64/runner/Release/

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  macos:
    needs: test
    runs-on: macos-latest
    # Mac est bonus : le navigateur intégré (bêta) n'y compile pas encore.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # CocoaPods (et non Swift Package Manager) pour pouvoir relever la
      # version minimale des plugins dans macos/Podfile.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-macOS
          path: build/macos/Build/Products/Release/*.app

  ios:
    needs: test
    runs-on: macos-latest
    # Appli iPhone non signée : à installer avec Sideloadly (voir INSTALL.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter build ios --release --no-codesign
      - name: Fabriquer le fichier .ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qr MonHub-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-iOS
          path: dist/MonHub-iOS.ipa

  linux:
    needs: test
    runs-on: ubuntu-latest
    # Linux est bonus : le navigateur intégré y demande WPE WebKit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libwpewebkit-2.0-dev libwpe-1.0-dev || sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libwpewebkit-1.1-dev libwpe-1.0-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Linux
          path: build/linux/x64/release/bundle/

  # Publie les fichiers sur la page « Releases » avec des liens fixes :
  # https://github.com/<compte>/mon-hub/releases/latest
  release:
    needs: [windows, android, ios]
    if: ${{ always() && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Préparer les fichiers
        run: |
          cd dist
          (cd MonHub-Windows && zip -qr ../MonHub-Windows.zip .)
          cp MonHub-Android/app-release.apk MonHub-Android.apk
          if [ -f MonHub-iOS/MonHub-iOS.ipa ]; then cp MonHub-iOS/MonHub-iOS.ipa .; fi
          (cd ../claude-extension && zip -qr ../dist/MonHub-Claude.mcpb .)
      - name: Publier la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "${{ github.repository }}" --cleanup-tag -y || true
          files="dist/MonHub-Windows.zip dist/MonHub-Android.apk dist/MonHub-Claude.mcpb"
          if [ -f dist/MonHub-iOS.ipa ]; then files="$files dist/MonHub-iOS.ipa"; fi
          gh release create latest $files \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Mon Hub (dernière version)" \
            --notes "PC Windows : MonHub-Windows.zip · Android : MonHub-Android.apk · iPhone : MonHub-iOS.ipa · Extension Claude (PC) : MonHub-Claude.mcpb · Guide : INSTALL.md"
