# Compile automatiquement l'appli pour Windows, Android, Mac et Linux
# à chaque push. Les fichiers prêts à installer apparaissent dans l'onglet
# « Actions » de GitHub > dernier run > « Artifacts ».
name: Build

env:
  # Connexion Google (secrets du dépôt, facultatifs) + numéro de version
  # affiché dans l'appli (le même que celui de la publication).
  GOOGLE_DEFINES: --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} --dart-define=APP_VERSION=v1.${{ github.run_number }} --dart-define=UPDATE_REPO=${{ github.repository }}

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sécurité : par défaut, les tâches ne peuvent que LIRE le dépôt. Seule la
# publication de la version (plus bas) a le droit d'écrire.
permissions:
  contents: read

# Deux constructions de suite sur main : la plus récente gagne.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build windows --release ${{ env.GOOGLE_DEFINES }}
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Windows
          path: build/windows/x64/runner/Release/

  android:
    needs: test
    # Désactivé : seule la version Windows est compilée (mettre true pour
    # recompiler Android).
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build apk --release ${{ env.GOOGLE_DEFINES }}
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  macos:
    needs: test
    # Désactivé : seule la version Windows est compilée (mettre true pour
    # recompiler Mac).
    if: false
    runs-on: macos-latest
    # Mac est bonus : le navigateur intégré (bêta) n'y compile pas encore.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # CocoaPods (et non Swift Package Manager) pour pouvoir relever la
      # version minimale des plugins dans macos/Podfile.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter build macos --release ${{ env.GOOGLE_DEFINES }}
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-macOS
          path: build/macos/Build/Products/Release/*.app

  # L'appli iPhone (iPhone 12 et plus récents) : ajoutée à la publication
  # dès qu'elle est prête, sans retarder la mise à jour du PC.
  ios:
    needs: test
    runs-on: macos-latest
    # Appli iPhone non signée : à installer avec Sideloadly (voir INSTALL.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter build ios --release --no-codesign ${{ env.GOOGLE_DEFINES }}
      - name: Fabriquer le fichier .ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qr MonHub-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-iOS
          path: dist/MonHub-iOS.ipa

  linux:
    needs: test
    # Désactivé : seule la version Windows est compilée (mettre true pour
    # recompiler Linux).
    if: false
    runs-on: ubuntu-latest
    # Linux est bonus : le navigateur intégré y demande WPE WebKit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libwpewebkit-2.0-dev libwpe-1.0-dev || sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libwpewebkit-1.1-dev libwpe-1.0-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build linux --release ${{ env.GOOGLE_DEFINES }}
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Linux
          path: build/linux/x64/release/bundle/

  # Publie les fichiers sur la page « Releases » avec des liens fixes :
  # https://github.com/<compte>/mon-hub/releases/latest
  release:
    # Seul Windows est indispensable : Android est ajouté s'il est prêt,
    # l'iPhone n'est jamais attendu (bonus).
    needs: [windows]
    # Seulement depuis main (un essai sur une autre branche ne publie rien).
    if: ${{ always() && needs.windows.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Préparer les fichiers
        run: |
          cd dist
          (cd MonHub-Windows && zip -qr ../MonHub-Windows.zip .)
          if [ -f MonHub-Android/app-release.apk ]; then cp MonHub-Android/app-release.apk MonHub-Android.apk; fi
          if [ -f MonHub-iOS/MonHub-iOS.ipa ]; then cp MonHub-iOS/MonHub-iOS.ipa .; fi
          (cd ../claude-extension && zip -qr ../dist/MonHub-Claude.mcpb .)
      - name: Publier la release (marquée « dernière version »)
        env:
          GH_TOKEN: ${{ github.token }}
          # Nouveautés montrées sur l'écran de mise à jour de Mon Hub.
          CHANGES: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n\n%s\n' "$CHANGES" "PC Windows : MonHub-Windows.zip · Extension Claude (PC) : MonHub-Claude.mcpb · Guide : INSTALL.md" > notes.md
          files="dist/MonHub-Windows.zip dist/MonHub-Claude.mcpb"
          if [ -f dist/MonHub-Android.apk ]; then files="$files dist/MonHub-Android.apk"; fi
          if [ -f dist/MonHub-iOS.ipa ]; then files="$files dist/MonHub-iOS.ipa"; fi
          # Un numéro par version : les liens « releases/latest/download/... »
          # pointent toujours vers la plus récente.
          gh release create "v1.${{ github.run_number }}" $files \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest \
            --title "Mon Hub v1.${{ github.run_number }}" \
            --notes-file notes.md

  # L'appli iPhone, ajoutée à la publication quand elle est prête.
  release-ios:
    needs: [release, ios]
    if: ${{ always() && needs.release.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: MonHub-iOS
          path: dist
      - name: Ajouter MonHub-iOS.ipa à la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f dist/MonHub-iOS.ipa ]; then
            gh release upload "v1.${{ github.run_number }}" dist/MonHub-iOS.ipa --clobber --repo "${{ github.repository }}"
          else
            echo "Pas d'appli iPhone cette fois (la compilation iPhone a échoué)."
          fi
