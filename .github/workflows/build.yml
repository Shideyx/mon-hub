# Compile automatiquement l'appli pour Windows, Android, Mac et Linux
# à chaque push. Les fichiers prêts à installer apparaissent dans l'onglet
# « Actions » de GitHub > dernier run > « Artifacts ».
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Windows
          path: build/windows/x64/runner/Release/

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-macOS
          path: build/macos/Build/Products/Release/*.app

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: MonHub-Linux
          path: build/linux/x64/release/bundle/
